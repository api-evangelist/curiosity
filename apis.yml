aid: curiosity

name: Curiosity

image: https://curiosity.ai/assets/social/home.png

description: Curiosity provides an AI‑powered enterprise knowledge graph platform that lets organizations connect, enrich, and query their data
  across systems. Built for on‑premises or private‑cloud deployment, Curiosity Studio enables users to build custom AI‑driven tools, search, embeddings,
  and agents while keeping data within their own infrastructure. The platform supports a REST API, SDKs for C# and Python, and extensive developer
  documentation covering data ingestion, security, and extensibility.

